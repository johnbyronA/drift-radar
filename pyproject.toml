[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "driftradar"
version = "1.0.0"
description = "Detecta drift entre dos versiones de un dataset y genera reportes HTML, JSON y Markdown listos para CI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Byron Alzate Hernández" }]
keywords = ["data-drift", "data-quality", "psi", "mlops", "monitoring", "analytics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6,<1", "pyarrow>=14"]

[project.scripts]
driftradar = "driftradar.cli:main"

[project.urls]
Homepage = "https://github.com/johnbyronA/drift-radar"
Issues = "https://github.com/johnbyronA/drift-radar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/driftradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules --import-mode=importlib"

[tool.coverage.run]
source = ["driftradar"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/driftradar/report/html.py" = ["E501"]
