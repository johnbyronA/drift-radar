name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests + cobertura
        run: pytest --cov --cov-report=xml
      - name: Smoke test CLI
        run: |
          driftradar --version
          driftradar demo --out demo --rows 2000
          test -s demo/reporte.html

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen
        run: docker build -t driftradar:ci .
      - name: Ejecutar demo en contenedor
        run: docker run --rm driftradar:ci --version
